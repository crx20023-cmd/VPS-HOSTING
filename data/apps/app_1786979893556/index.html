<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8"><title>VPS-PANEL Demo</title>
<style>
body{margin:0;font-family:system-ui;background:linear-gradient(135deg,#0b0e14,#141a2c);color:#d7dce8;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#11151f;border:1px solid #242b3d;border-radius:16px;padding:2.5rem;max-width:480px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
h1{font-size:1.8rem;margin:0 0 .4rem} .accent{color:#22d3ee}
.badge{display:inline-block;background:rgba(34,211,238,.12);color:#22d3ee;border-radius:20px;padding:.25rem .8rem;font-size:.75rem;letter-spacing:1px;margin-bottom:1rem}
p{color:#7c869c;line-height:1.6}
.btn{display:inline-block;background:linear-gradient(135deg,#0891b2,#0e7490);color:#fff;text-decoration:none;padding:.6rem 1.4rem;border-radius:8px;font-weight:600}
.stats{display:flex;gap:1rem;justify-content:center;margin:1.2rem 0}
.stat{background:#171c29;border:1px solid #242b3d;border-radius:10px;padding:.6rem 1rem}
.stat b{display:block;font-size:1.2rem;color:#22d3ee}
.stat span{font-size:.7rem;color:#7c869c}
</style></head><body>
<div class="card">
  <span class="badge">STATIC APP · HOSTED ON VPS-PANEL</span>
  <h1>Hello from <span class="accent">VPS-PANEL</span>! 👋</h1>
  <p>এই পেজটা একটা <b>static</b> টাইপ অ্যাপ — প্যানেলের ফাইল ম্যানেজার থেকে এডিট করে সেভ করলেই লাইভ আপডেট হবে।</p>
  <div class="stats">
    <div class="stat"><b>4</b><span>APP TYPES</span></div>
    <div class="stat"><b>WS</b><span>TERMINAL</span></div>
    <div class="stat"><b>∞</b><span>QUOTA</span></div>
  </div>
  <a class="btn" href="https://127.0.0.1:8080/" target="_blank">BACK TO PANEL</a>
</div>
</body></html>
